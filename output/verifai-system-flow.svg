<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="title desc">
<title id="title">Verifai system flowchart</title><desc id="desc">Flow from user supplied text, media, or a news claim through the Verifai client, API access checks, analysis engines, storage, and results.</desc>
<defs><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#102747" flood-opacity=".10"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4775B9"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4D9B91"/></marker><style>
text{font-family:Inter,'Segoe UI',Arial,sans-serif;fill:#1F2937}.title{font-size:32px;font-weight:750}.sub{font-size:14px;fill:#64748B}.lane{fill:#F9FBFE;stroke:#CCD8E7;stroke-width:1.3;stroke-dasharray:6 5}.laneTitle{font-size:13px;font-weight:750;letter-spacing:1px;fill:#607087}.card{fill:white;stroke:#D7E1ED;stroke-width:1.2;filter:url(#s)}.blue{fill:#0B3D91}.teal{fill:#147A72}.gold{fill:#F4B400}.red{fill:#D7263D}.white{fill:white}.hd{font-size:16px;font-weight:700}.body{font-size:12.5px;fill:#58677B}.tiny{font-size:11px;fill:#718198}.arrow{fill:none;stroke:#4775B9;stroke-width:2.4;marker-end:url(#a)}.arrow2{fill:none;stroke:#4D9B91;stroke-width:2.2;marker-end:url(#g)}.tag{font-size:10px;font-weight:700;letter-spacing:.6px}.pill{fill:#E9EFF8}.pillText{font-size:10px;font-weight:700;fill:#315785}
</style></defs>
<rect width="1800" height="1040" fill="#F5F8FC"/><text x="60" y="62" class="title">Verifai · system flow</text><text x="60" y="91" class="sub">How user content moves through access checks, analysis, persistence, and results</text>
<!-- swim lanes -->
<rect x="42" y="130" width="250" height="760" rx="16" class="lane"/><text x="62" y="162" class="laneTitle">1 · INPUT</text>
<rect x="320" y="130" width="270" height="760" rx="16" class="lane"/><text x="340" y="162" class="laneTitle">2 · CLIENT</text>
<rect x="618" y="130" width="270" height="760" rx="16" class="lane"/><text x="638" y="162" class="laneTitle">3 · API ACCESS</text>
<rect x="916" y="130" width="470" height="760" rx="16" class="lane"/><text x="936" y="162" class="laneTitle">4 · ANALYSIS</text>
<rect x="1414" y="130" width="170" height="760" rx="16" class="lane"/><text x="1434" y="162" class="laneTitle">5 · STORAGE</text>
<rect x="1610" y="130" width="150" height="760" rx="16" class="lane"/><text x="1630" y="162" class="laneTitle">6 · OUTPUT</text>
<!-- input cards -->
<g><rect x="67" y="220" width="200" height="128" rx="14" class="card"/><circle cx="102" cy="258" r="17" fill="#E8EEF8"/><path d="M93 258h18m-9-9v18" stroke="#0B3D91" stroke-width="2.5" stroke-linecap="round"/><text x="130" y="258" class="hd">Text</text><text x="87" y="300" class="body">Paste writing or upload</text><text x="87" y="319" class="body">a .txt file</text></g>
<g><rect x="67" y="390" width="200" height="128" rx="14" class="card"/><circle cx="102" cy="428" r="17" fill="#E8EEF8"/><rect x="93" y="420" width="18" height="15" rx="2" fill="none" stroke="#0B3D91" stroke-width="2"/><circle cx="99" cy="425" r="2" fill="#F4B400"/><path d="m94 433 5-5 3 3 3-3 5 5" fill="none" stroke="#0B3D91" stroke-width="1.5"/><text x="130" y="428" class="hd">Image</text><text x="87" y="470" class="body">Upload media for AI</text><text x="87" y="489" class="body">signals or claim checks</text></g>
<g><rect x="67" y="560" width="200" height="128" rx="14" class="card"/><circle cx="102" cy="598" r="17" fill="#FFF5D5"/><path d="M93 591h18v14H93zM96 588h12" fill="none" stroke="#A77700" stroke-width="2"/><text x="130" y="598" class="hd">News claim</text><text x="87" y="640" class="body">Paste a claim or upload</text><text x="87" y="659" class="body">a story screenshot</text></g>
<!-- client -->
<g><rect x="348" y="300" width="214" height="245" rx="18" class="card"/><rect x="426" y="323" width="58" height="75" rx="10" fill="#E8EEF8" stroke="#0B3D91" stroke-width="2"/><rect x="435" y="334" width="40" height="42" rx="3" fill="white"/><circle cx="455" cy="386" r="3" fill="#0B3D91"/><text x="455" y="433" class="hd" text-anchor="middle">Verifai web app</text><text x="455" y="460" class="body" text-anchor="middle">Dashboard · guest scanner</text><text x="455" y="482" class="body" text-anchor="middle">Uploads · analysis request</text><rect x="392" y="502" width="126" height="24" rx="12" class="pill"/><text x="455" y="518" class="pillText" text-anchor="middle">HTTPS · JSON / file</text></g>
<!-- access -->
<g><rect x="647" y="250" width="212" height="125" rx="14" class="card"/><rect x="647" y="250" width="212" height="9" rx="5" class="blue"/><circle cx="681" cy="291" r="17" fill="#E8EEF8"/><path d="M674 291v-5a7 7 0 0 1 14 0v5m-16 0h18v14h-18z" fill="none" stroke="#0B3D91" stroke-width="2"/><text x="711" y="290" class="hd">Registered user</text><text x="667" y="330" class="body">Session authentication</text><text x="667" y="350" class="tiny">User identity for scan history</text></g>
<g><rect x="647" y="420" width="212" height="125" rx="14" class="card"/><rect x="647" y="420" width="212" height="9" rx="5" class="teal"/><circle cx="681" cy="461" r="17" fill="#E5F3F1"/><circle cx="681" cy="456" r="5" fill="none" stroke="#147A72" stroke-width="2"/><path d="M671 473q10-13 20 0" fill="none" stroke="#147A72" stroke-width="2"/><text x="711" y="460" class="hd">Guest visitor</text><text x="667" y="500" class="body">Consent token + quota</text><text x="667" y="520" class="tiny">Text · image · news limits</text></g>
<g><rect x="647" y="610" width="212" height="115" rx="14" class="card"/><text x="667" y="648" class="hd">Request safeguards</text><text x="667" y="674" class="body">Validation · rate limits</text><text x="667" y="696" class="body">File type / size checks</text></g>
<!-- analysis engines -->
<g><rect x="946" y="210" width="410" height="150" rx="14" class="card"/><rect x="946" y="210" width="9" height="150" rx="4" class="blue"/><circle cx="987" cy="251" r="20" fill="#E8EEF8"/><path d="M978 251h18m-14-6 5 6-5 6m10-12-5 6 5 6" fill="none" stroke="#0B3D91" stroke-width="2"/><text x="1020" y="250" class="hd">Text AI detector</text><text x="970" y="291" class="body">Local RoBERTa model or Gemini classifier</text><text x="970" y="316" class="tiny">Returns likelihoods, signals, and a cautious assessment</text><rect x="1222" y="226" width="112" height="22" rx="11" fill="#E9EFF8"/><text x="1278" y="241" class="pillText" text-anchor="middle">/detector/text</text></g>
<g><rect x="946" y="395" width="410" height="150" rx="14" class="card"/><rect x="946" y="395" width="9" height="150" rx="4" class="teal"/><circle cx="987" cy="436" r="20" fill="#E5F3F1"/><rect x="976" y="428" width="22" height="16" rx="3" fill="none" stroke="#147A72" stroke-width="2"/><path d="m979 441 5-5 4 3 4-4 4 5" fill="none" stroke="#147A72" stroke-width="1.5"/><text x="1020" y="435" class="hd">Image assessment</text><text x="970" y="476" class="body">Gemini vision checks visible generation signals</text><text x="970" y="501" class="tiny">Image claim checks may continue through OCR + news evidence</text><rect x="1222" y="411" width="112" height="22" rx="11" fill="#E5F3F1"/><text x="1278" y="426" class="pillText" text-anchor="middle">/detector/image</text></g>
<g><rect x="946" y="580" width="410" height="184" rx="14" class="card"/><rect x="946" y="580" width="9" height="184" rx="4" class="gold"/><circle cx="987" cy="621" r="20" fill="#FFF5D5"/><path d="M978 615h18v13h-18zM980 632h14m-11-4 3-4 3 3 3-5" fill="none" stroke="#A77700" stroke-width="1.8"/><text x="1020" y="620" class="hd">News verification</text><text x="970" y="661" class="body">Search providers retrieve related reporting</text><text x="970" y="686" class="body">Evidence is compared and adjudicated</text><text x="970" y="716" class="tiny">Sources + verdict · empty results can remain unverified</text><rect x="1222" y="596" width="112" height="22" rx="11" fill="#FFF5D5"/><text x="1278" y="611" class="pillText" text-anchor="middle">/news/verify</text></g>
<rect x="946" y="802" width="410" height="54" rx="12" fill="#E9EFF8"/><text x="1151" y="825" class="body" text-anchor="middle" style="font-weight:700">Successful account scans are recorded</text><text x="1151" y="844" class="tiny" text-anchor="middle">Guest requests update quota usage</text>
<!-- storage -->
<g><rect x="1435" y="264" width="128" height="156" rx="14" class="card"/><ellipse cx="1499" cy="292" rx="32" ry="11" fill="#E8EEF8" stroke="#0B3D91" stroke-width="2"/><path d="M1467 292v37c0 6 14 11 32 11s32-5 32-11v-37M1467 310c0 6 14 11 32 11s32-5 32-11" fill="#E8EEF8" stroke="#0B3D91" stroke-width="2"/><text x="1499" y="370" class="hd" text-anchor="middle">PostgreSQL</text><text x="1499" y="391" class="tiny" text-anchor="middle">scan_results</text><text x="1499" y="407" class="tiny" text-anchor="middle">account scans</text></g>
<g><rect x="1435" y="500" width="128" height="156" rx="14" class="card"/><ellipse cx="1499" cy="528" rx="32" ry="11" fill="#E5F3F1" stroke="#147A72" stroke-width="2"/><path d="M1467 528v37c0 6 14 11 32 11s32-5 32-11v-37M1467 546c0 6 14 11 32 11s32-5 32-11" fill="#E5F3F1" stroke="#147A72" stroke-width="2"/><text x="1499" y="606" class="hd" text-anchor="middle">Guest quota</text><text x="1499" y="627" class="tiny" text-anchor="middle">identity · sessions</text><text x="1499" y="643" class="tiny" text-anchor="middle">usage counters</text></g>
<text x="1499" y="713" class="tiny" text-anchor="middle">Analysis output</text><text x="1499" y="730" class="tiny" text-anchor="middle">returns to client</text>
<!-- results -->
<g><rect x="1624" y="342" width="122" height="202" rx="14" class="card"/><rect x="1652" y="365" width="66" height="82" rx="7" fill="#E8EEF8" stroke="#0B3D91" stroke-width="2"/><path d="m1666 389 7 7 14-16m-21 32h32m-32 12h25" fill="none" stroke="#0B3D91" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="1685" y="477" class="hd" text-anchor="middle">Results</text><text x="1685" y="502" class="tiny" text-anchor="middle">Verdict · evidence</text><text x="1685" y="520" class="tiny" text-anchor="middle">signals · confidence</text></g>
<!-- arrows -->
<path d="M267 284H348" class="arrow"/><path d="M267 454H320V420H348" class="arrow"/><path d="M267 624H320V520H348" class="arrow"/>
<path d="M562 400H605V312H647" class="arrow"/><path d="M605 400V482H647" class="arrow2"/>
<path d="M753 375V610" class="arrow"/><path d="M753 545V610" class="arrow2"/>
<path d="M859 655H905V285H946" class="arrow"/><path d="M905 470H946" class="arrow2"/><path d="M905 650H946" class="arrow"/>
<path d="M1356 285H1400V342H1435" class="arrow"/><path d="M1356 470H1400V578H1435" class="arrow2"/><path d="M1356 672H1400V578H1435" class="arrow"/>
<path d="M1356 343H1390V829H1356" class="arrow"/><path d="M1356 470H1380V829H1356" class="arrow2"/><path d="M1356 672H1370V829H1356" class="arrow"/>
<path d="M1563 710H1590V444H1624" class="arrow"/>
<text x="60" y="955" class="tiny">Conceptual flow reflects implemented routes and persistence behavior. Guest image news checks can pass through image extraction and news verification.</text>
</svg>
