<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
<title id="title">Verifai use case diagram</title><desc id="desc">Use cases for guest visitors, registered users, and administrators within the Verifai system.</desc>
<defs><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#102747" flood-opacity=".10"/></filter><style>
text{font-family:Inter,'Segoe UI',Arial,sans-serif;fill:#1F2937}.title{font-size:32px;font-weight:750}.sub{font-size:14px;fill:#64748B}.boundary{fill:#F8FAFD;stroke:#9FB3CA;stroke-width:1.7}.boundaryTitle{font-size:14px;font-weight:750;letter-spacing:1px;fill:#0B3D91}.oval{fill:white;stroke:#AFC0D4;stroke-width:1.5;filter:url(#s)}.guest{stroke:#62A89F}.admin{stroke:#D5AE47}.label{font-size:14px;font-weight:650}.small{font-size:11px;fill:#64748B}.assoc{stroke:#91A4BA;stroke-width:1.6;fill:none}.actor{stroke:#44546A;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.actorLabel{font-size:13px;font-weight:650;text-anchor:middle}.chip{fill:#E8EEF8}.chipText{font-size:10px;font-weight:700;fill:#315785;letter-spacing:.5px}
</style></defs>
<rect width="1600" height="1080" fill="#F5F8FC"/><text x="58" y="62" class="title">Verifai · use case diagram</text><text x="58" y="91" class="sub">Who can use each part of the application</text>
<!-- system boundary -->
<rect x="295" y="145" width="980" height="820" rx="18" class="boundary"/><text x="330" y="184" class="boundaryTitle">VERIFAI PLATFORM</text><rect x="1100" y="161" width="139" height="28" rx="14" class="chip"/><text x="1169" y="180" class="chipText" text-anchor="middle">WEB APP + API</text>
<!-- associations behind use case ovals -->
<!-- orthogonal actor links reduce crossings and keep roles explicit -->
<path d="M176 315H260V300H358M260 315V420H358M260 420H728M260 420H1028M260 420V580H358M260 580H728" class="assoc"/>
<path d="M176 735H278V300H728M278 735V420H358M278 420H728M278 420H1028M278 735V580H358M278 735H358M278 735H728M278 735H1028M278 735V870H358" class="assoc"/>
<path d="M1407 515H1342V870H1012" class="assoc"/>
<!-- guest actor -->
<g transform="translate(108 266)"><circle cx="40" cy="17" r="14" class="actor"/><path d="M40 31v56M40 47 12 68M40 47 68 68M40 87 15 124M40 87 65 124" class="actor"/><text x="40" y="150" class="actorLabel">Guest visitor</text></g>
<!-- registered actor -->
<g transform="translate(108 682)"><circle cx="40" cy="17" r="14" class="actor"/><path d="M40 31v56M40 47 12 68M40 47 68 68M40 87 15 124M40 87 65 124" class="actor"/><text x="40" y="150" class="actorLabel">Registered</text><text x="40" y="167" class="actorLabel">user</text></g>
<!-- admin actor -->
<g transform="translate(1395 459)"><circle cx="40" cy="17" r="14" class="actor"/><path d="M40 31v56M40 47 12 68M40 47 68 68M40 87 15 124M40 87 65 124" class="actor"/><text x="40" y="150" class="actorLabel">Administrator</text></g>
<!-- cases -->
<g><ellipse cx="500" cy="300" rx="142" ry="47" class="oval guest"/><text x="500" y="296" text-anchor="middle" class="label">Accept guest consent</text><text x="500" y="316" text-anchor="middle" class="small">Issue guest session token</text></g>
<g><ellipse cx="870" cy="300" rx="142" ry="47" class="oval"/><text x="870" y="296" text-anchor="middle" class="label">Create account / sign in</text><text x="870" y="316" text-anchor="middle" class="small">Register · authenticate · sign out</text></g>
<g><ellipse cx="500" cy="440" rx="142" ry="47" class="oval guest"/><text x="500" y="436" text-anchor="middle" class="label">Analyze text</text><text x="500" y="456" text-anchor="middle" class="small">Estimate AI writing signals</text></g>
<g><ellipse cx="870" cy="440" rx="142" ry="47" class="oval guest"/><text x="870" y="436" text-anchor="middle" class="label">Analyze image</text><text x="870" y="456" text-anchor="middle" class="small">Assess visible AI signals</text></g>
<g><ellipse cx="1140" cy="440" rx="112" ry="47" class="oval guest"/><text x="1140" y="436" text-anchor="middle" class="label">Check news</text><text x="1140" y="456" text-anchor="middle" class="small">Claim or story image</text></g>
<g><ellipse cx="500" cy="580" rx="142" ry="47" class="oval guest"/><text x="500" y="576" text-anchor="middle" class="label">View analysis results</text><text x="500" y="596" text-anchor="middle" class="small">Verdict · evidence · limitations</text></g>
<g><ellipse cx="870" cy="580" rx="142" ry="47" class="oval guest"/><text x="870" y="576" text-anchor="middle" class="label">Check guest quota</text><text x="870" y="596" text-anchor="middle" class="small">View remaining free checks</text></g>
<g><ellipse cx="500" cy="735" rx="142" ry="47" class="oval"/><text x="500" y="731" text-anchor="middle" class="label">View dashboard</text><text x="500" y="751" text-anchor="middle" class="small">Summary and recent activity</text></g>
<g><ellipse cx="870" cy="735" rx="142" ry="47" class="oval"/><text x="870" y="731" text-anchor="middle" class="label">Review scan history</text><text x="870" y="751" text-anchor="middle" class="small">View, delete, or clear own scans</text></g>
<g><ellipse cx="1140" cy="735" rx="112" ry="47" class="oval"/><text x="1140" y="731" text-anchor="middle" class="label">Manage sessions</text><text x="1140" y="751" text-anchor="middle" class="small">View / revoke sessions</text></g>
<g><ellipse cx="500" cy="870" rx="142" ry="47" class="oval"/><text x="500" y="866" text-anchor="middle" class="label">Manage account</text><text x="500" y="886" text-anchor="middle" class="small">Profile and password reset</text></g>
<g><ellipse cx="870" cy="870" rx="142" ry="47" class="oval admin"/><text x="870" y="866" text-anchor="middle" class="label">List user accounts</text><text x="870" y="886" text-anchor="middle" class="small">Administrator access required</text></g>
<!-- footer notes -->
<rect x="322" y="927" width="925" height="24" rx="12" fill="#E8EEF8"/><text x="784" y="944" text-anchor="middle" class="small">Guest use cases follow consent and quota rules · account history and session tools require sign-in</text>
<text x="58" y="1024" class="small">Based on implemented frontend routes and backend endpoints. Administrator use is limited here to the implemented user listing endpoint.</text>
</svg>
