name: Scan repository for secrets

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject tracked local configuration and runtime records
        shell: python
        run: |
          import pathlib
          import subprocess
          files = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          blocked = []
          for name in filter(None, files):
              path = pathlib.PurePosixPath(name)
              if (
                  (path.name == ".env" or path.name.startswith(".env."))
                  and path.name != ".env.example"
              ) or name.startswith(("audit/", "Verifai-backend/logs/")):
                  blocked.append(name)
          if blocked:
              raise SystemExit("Remove private local files from Git: " + ", ".join(blocked))

      - name: Scan full Git history with redacted output
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo"
          zricethezav/gitleaks:v8.30.1
          git /repo --config /repo/.gitleaks.toml --redact --no-banner --log-opts="--all"
